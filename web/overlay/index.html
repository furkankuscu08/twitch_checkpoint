<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Checkpoint overlay</title>
  <link rel="stylesheet" href="/assets/theme.css">
  <link rel="stylesheet" href="/overlay/style.css">
  <script type="module" src="/overlay/app.js"></script>
</head>
<body>
  <main id="stage" aria-label="Checkpoint overlay">
    <div id="badge" hidden>
      <span class="diamond" aria-hidden="true"></span>
      <strong id="badge-label">FOCUS</strong>
      <span id="crystals" aria-label="Saved viewers"></span>
      <span id="queue-count">0</span>
      <span id="thread-tick" hidden></span>
    </div>
    <aside id="earlier-toast" hidden aria-live="polite"></aside>
    <div id="card-host"></div>
    <section id="summary" hidden aria-live="polite">
      <p class="summary-title">CHECKPOINT SAVED <span>✓</span></p>
      <p id="summary-counts"></p>
    </section>
  </main>
</body>
</html>

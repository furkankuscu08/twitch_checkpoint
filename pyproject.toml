[project]
name = "checkpoint"
version = "0.1.0"
description = "Answer Twitch chat out loud with the streamer's own words."
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.162.0",
    "httpx>=0.28",
    "python-dotenv>=1.0",
    "uvicorn>=0.54.0",
    "websockets>=17.3",
]

[dependency-groups]
dev = [
    "playwright>=1.64.1",
    "pytest>=8",
    "respx>=0.22",
    "ruff>=0.9",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-m 'not live and not browser'"
markers = [
    "live: requires network access and local credentials",
    "browser: requires Playwright and Chromium",
]
# FastAPI's own TestClient import triggers this Starlette deprecation; not our code.
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient` is deprecated"]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]

# Unported WP6 references retain their original imports until that work package.
[tool.ruff.lint.per-file-ignores]
"scripts/blind_plant.py" = ["I001"]
"tests/test_blind_plant.py" = ["I001"]
